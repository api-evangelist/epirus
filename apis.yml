aid: epirus
name: Epirus
description: >-
  Epirus is a Torrance, California-based defense technology company building
  solid-state, software-defined high-power microwave (HPM) directed-energy
  systems for counter-electronics and counter-unmanned-aerial-systems (cUAS)
  missions. Its flagship product is Leonidas, a non-kinetic HPM weapon system
  designed to defeat single drones and large drone swarms by disabling their
  onboard electronics, with a growing product family that includes Leonidas
  IFPC-HPM (Indirect Fire Protection Capability — High-Power Microwave) for
  the U.S. Army, Leonidas Expeditionary (ExDECS) for the U.S. Marine Corps,
  Leonidas H2O for maritime interdiction, the portable Leonidas Pod, and
  Stryker Leonidas (with General Dynamics Land Systems). Epirus also
  collaborates with Anduril, Northrop Grumman, L3Harris, Kodiak AI, Peraton,
  and Palantir, and has received contracts from the U.S. Army, U.S. Air Force,
  U.S. Navy, DARPA, ONR, and Singapore's DSTA. The company is privately held,
  has raised more than $550M across Series B/C/D, and operates under CMMC
  Level 2 certification. Its product surface is classified defense hardware
  and embedded firmware — there is no public developer portal, REST API,
  SDK, or open-source software offering.
